name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck bin/agent-skills bootstrap.sh tests/smoke.sh

      - name: validate skills
        run: bin/agent-skills validate

      - name: smoke test (fake HOME)
        run: tests/smoke.sh

      - name: README skill table is up to date
        run: |
          bin/agent-skills readme
          git diff --exit-code README.md || {
            echo "README skill table is stale — run: bin/agent-skills readme" >&2
            exit 1
          }
